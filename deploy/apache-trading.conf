RedirectMatch 301 ^/trading$ /trading/
Alias /trading/ /var/www/trading-journal/

<Directory /var/www/trading-journal>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
    SetEnv TRADING_DATA_DIR /var/lib/trading-journal
</Directory>

# Knihovny, šablony a nástroje pro příkazovou řádku se z webu nespouštějí.
<DirectoryMatch "^/var/www/trading-journal/(data|lib|bin)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/lib/trading-journal>
    Require all denied
</Directory>
