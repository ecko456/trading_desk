RedirectMatch 301 ^/trading$ /trading/
Alias /trading/ /var/www/trading-journal/

<Directory /var/www/trading-journal>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    SetEnv TRADING_DATA_DIR /var/lib/trading-journal

    # Na veřejném serveru chrání aplikaci heslo. Zapne se samo, jakmile existuje
    # soubor s hesly, takže ho aktualizace přes install.sh nevypne.
    <IfFile /etc/apache2/trading-journal.htpasswd>
        AuthType Basic
        AuthName "Trading Desk"
        AuthUserFile /etc/apache2/trading-journal.htpasswd
        Require valid-user
    </IfFile>
    <IfFile !/etc/apache2/trading-journal.htpasswd>
        Require all granted
    </IfFile>
</Directory>

<Directory /var/www/trading-journal/data>
    Require all denied
</Directory>

<Directory /var/lib/trading-journal>
    Require all denied
</Directory>
