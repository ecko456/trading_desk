RedirectMatch 301 ^/trading$ /trading/
Alias /trading/ /var/www/trading-journal/

<Directory /var/www/trading-journal>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
    SetEnv TRADING_DATA_DIR /var/lib/trading-journal

    # Z webu jsou vidět jen stránky aplikace a soubory ve static/. Skryté soubory
    # (.gitignore, .user.ini), dokumentace, archivy a skripty pro příkazovou řádku ne.
    <FilesMatch "(^\.|\.(md|txt|zip|py|sh|bat|command|ini|json|sqlite3|sealed|lock|log|bak)$)">
        Require all denied
    </FilesMatch>

    # Apache s mod_php nečte .user.ini, limity pro screenshoty se proto nastavují tady.
    <IfModule php_module>
        php_value upload_max_filesize 20M
        php_value post_max_size 64M
        php_value max_file_uploads 20
    </IfModule>
</Directory>

# Knihovny, nástroje, testy a skryté adresáře (.git) se z webu nespouštějí ani nečtou.
<DirectoryMatch "^/var/www/trading-journal/(\.[^/]*|data|lib|bin|tests|deploy)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/lib/trading-journal>
    Require all denied
</Directory>
